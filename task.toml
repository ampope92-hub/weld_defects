name = "weld-defects"

# The verifier reads only these paths from the agent's final environment. Must stay
# top-level: nested under [verifier] the value is silently dropped.
artifacts = [
    "/app/predictor/src/",
    "/app/predictor/Cargo.toml",
    "/app/predictor/Cargo.lock",
    "/app/data/",
]

[metadata]
category = "ML"
subcategory = "Training"
tags = ["rust", "smartcore", "cargo", "classification", "imbalanced-data"]
languages = ["rust"]
difficulty = "advanced"
expert_time_estimate_hours = 8
author_name = "anonymous"
author_email = "anonymous"

difficulty_explanation = """
The inspection findings are steeply imbalanced — 70% of welds are clean and cracks are 2% —
and the grade is the mean per-defect-type catch rate, with a crack counting exactly as much
as a clean weld. Every classifier fits for overall accuracy unless told otherwise, and on
this data that means calling almost everything clean or porosity: it reaches about 78%
accuracy and 0.41 on the graded metric, against a 0.47 bar. The trap is that the usual
escape routes do nothing. More capacity does not help — tuned boosting and random forests
land in the same place as plain logistic regression, because the fitting objective rather
than the model is what is wrong. The rare classes are genuinely separable, so this is not a
hopeless-minority problem; it is a weighting problem. On top of that, smartcore has no
sample_weight argument on its classifiers, so the familiar one-line fix is unavailable and
the training set itself has to be rebalanced.

Calibrated across 5 generator seeds: the best wrong answer is 0.4406 and the weakest of four
correct routes is 0.4998, with the bar at 0.47 between them. Scoring is on the predicted
class via argmax, so there is no decision threshold to tune and no element of luck in
clearing the bar.
"""

solution_explanation = """
The reference (solution/solve.sh) writes src/main.rs and runs the Cargo project. It groups
the training rows by finding and draws the same number of rows for each of the five classes,
cycling deterministically through each class's rows with replacement for the rare ones, so
every class carries equal weight in the loss. It then standardizes with the training means
and sds and fits smartcore's multinomial LogisticRegression, writing back the argmax class
name. It scores about 0.60 against the 0.47 bar.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's crate sources
(/app/predictor/src, Cargo.toml, Cargo.lock) and the shipped export (/app/data) as
artifacts, drops them onto a prepared skeleton whose dependency tree is already compiled,
and runs cargo build/run --release --offline itself. The graded predictions.csv is
therefore always the output of a clean build of the agent's own code — a hand-written
predictions file never reaches the grader.

tests/test_outputs.py then runs six checks: the shipped export is unaltered (sha256), the
schema, one-to-one coverage of the held-back welds, that every call is one of the five
recorded findings, that the calls did not collapse to a single class, and that the mean
per-type catch rate against tests/golden/test_labels.csv reaches 0.47. The golden labels
live in the verifier image and are never present in the agent environment, so hardcoding is
impossible by construction. Only pytest is installed, so the CSV reading and the macro
recall come from the standard library.
"""

relevant_experience = """
I build classifiers for industrial inspection and quality data, where the class of interest
is almost always the rarest one and headline accuracy actively misleads — the models that
look best are the ones that quietly never call a crack. Calibrating this task meant
establishing across five generated seeds that the wrong arms are the more accurate ones, and
that no amount of extra model capacity closes the gap, so the bar separates a correctly
weighted fit from a well-tuned but misdirected one. Implementing it in smartcore, which has
no sample_weight argument, meant doing the rebalancing by explicit resampling.
"""

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 3600

[environment]
network_mode = "no-network"
build_timeout_sec = 900
cpus = 2
memory_mb = 6144
storage_mb = 10240
